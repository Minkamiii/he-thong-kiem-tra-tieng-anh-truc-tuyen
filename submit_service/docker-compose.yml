version: "3.9"
services:
  submitservice:
    build: .
    container_name: submit-service
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: mydb
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123345
      POSTGRES_DB: submit
    ports:
      - "3306:3306"
